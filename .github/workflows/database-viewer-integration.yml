name: Database viewer integration

on:
  pull_request:
    paths:
      - ".github/workflows/database-viewer-integration.yml"
      - "native/sql-language-worker/**"
      - "scripts/build-sql-language-worker.sh"
      - "scripts/test-database-viewer-integration.sh"
      - "src/Asura.App/**"
      - "src/Asura.Application/**"
      - "src/Asura.Databases/**"
      - "src/Asura.Infrastructure/**"
      - "src/Asura.Redis/**"
      - "tests/Asura.Databases.IntegrationTests/**"
      - "tests/Asura.Redis.Tests/**"
      - "tests/Asura.Infrastructure.Tests/CalciteSqlLanguageNativeIntegrationTests.cs"
      - "tools/Asura.SqlLanguageAotProbe/**"
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 0"

permissions:
  contents: read

concurrency:
  group: database-viewer-integration-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # The existing integration harness builds and executes Linux containers.
  # Keep it dormant until the application and harness support the current
  # macOS-only product target.
  sql-language-worker:
    name: Native Calcite worker
    if: ${{ false }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build and smoke-test the linked worker
        run: ./scripts/build-sql-language-worker.sh --docker --rid linux-x64

      - name: Publish the production client as Native AOT
        run: |
          dotnet restore \
            tools/Asura.SqlLanguageAotProbe/Asura.SqlLanguageAotProbe.csproj \
            --runtime linux-x64 \
            --locked-mode \
            -p:PublishAot=true
          dotnet publish \
            tools/Asura.SqlLanguageAotProbe/Asura.SqlLanguageAotProbe.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            -p:PublishAot=true \
            --no-restore \
            --output artifacts/sql-language-aot-probe

      - name: Run Native-AOT client without the optional worker
        run: >-
          env -u ASURA_SQL_LANGUAGE_WORKER
          ./artifacts/sql-language-aot-probe/Asura.SqlLanguageAotProbe

      - name: Run Native-AOT client through the real worker
        env:
          ASURA_SQL_LANGUAGE_WORKER: ${{ github.workspace }}/native/artifacts/linux-x64/asura-sql-language
        run: ./artifacts/sql-language-aot-probe/Asura.SqlLanguageAotProbe

      - name: Upload the tested worker
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sql-language-worker-linux-x64
          path: native/artifacts/linux-x64
          if-no-files-found: error
          retention-days: 7

  provider-conformance:
    name: ${{ matrix.provider }} conformance
    if: ${{ false }}
    needs: sql-language-worker
    runs-on: macos-15
    timeout-minutes: 30
    env:
      ASURA_RUN_SQL_LANGUAGE_NATIVE: "1"
      ASURA_SQL_LANGUAGE_WORKER: ${{ github.workspace }}/native/artifacts/linux-x64/asura-sql-language
    strategy:
      fail-fast: false
      matrix:
        provider:
          - sqlite
          - duckdb
          - postgres
          - cockroach
          - redshift
          - mysql
          - mariadb
          - sqlserver
          - oracle
          - firebird
          - clickhouse
          - redis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the tested SQL language worker
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sql-language-worker-linux-x64
          path: native/artifacts/linux-x64

      - name: Restore the worker executable bit
        run: |
          chmod +x native/artifacts/linux-x64/asura-sql-language
          test -x native/artifacts/linux-x64/asura-sql-language

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Expose the SDK at the repository-local path
        shell: bash
        run: |
          mkdir -p .dotnet
          ln -s "$(command -v dotnet)" .dotnet/dotnet

      - name: Restore the locked dependency graph
        run: dotnet restore Asura.slnx --locked-mode

      - name: Run the real native client lifecycle
        run: >-
          ./.dotnet/dotnet test
          tests/Asura.Infrastructure.Tests/Asura.Infrastructure.Tests.csproj
          --configuration Release
          --no-restore
          --filter "FullyQualifiedName~CalciteSqlLanguageNativeIntegrationTests"
          --logger "trx;LogFileName=sql-language-native-${{ matrix.provider }}.trx"

      - name: Run database viewer conformance
        run: >-
          ./scripts/test-database-viewer-integration.sh
          ${{ matrix.provider }}
          --no-restore
          --logger "trx;LogFileName=database-viewer-${{ matrix.provider }}.trx"

      - name: Upload test result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database-viewer-${{ matrix.provider }}-results
          path: |
            tests/Asura.Databases.IntegrationTests/TestResults/*.trx
            tests/Asura.Infrastructure.Tests/TestResults/*.trx
          if-no-files-found: warn
