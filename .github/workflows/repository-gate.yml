name: Repository gate

on:
  push:
    tags: ["v*"]

permissions:
  actions: read
  contents: read

concurrency:
  group: repository-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  terminal-native-assets:
    name: Build macOS terminal runtime
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Expose the SDK at the repository-local path
        run: |
          mkdir -p .dotnet
          ln -s "$(command -v dotnet)" .dotnet/dotnet
      - name: Restore verified terminal payload cache
        id: terminal-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/artifacts/common
            native/artifacts/osx-arm64
          key: >-
            terminal-osx-arm64-${{ hashFiles(
              'scripts/build-libghostty-vt.sh',
              'scripts/build-terminal-font-assets.sh',
              'native/ghostty-vt/**',
              'licenses/native-terminal-components.json',
              'licenses/terminal-font-assets.json') }}
      - name: Build verified terminal payload
        if: steps.terminal-cache.outputs.cache-hit != 'true'
        shell: bash
        run: >-
          ASURA_DOTNET="$(command -v dotnet)"
          ./scripts/build-libghostty-vt.sh --rid osx-arm64
      - name: Upload terminal font assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terminal-font-test-assets
          path: native/artifacts/common
          if-no-files-found: error
          retention-days: 1
      - name: Upload terminal runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terminal-native-osx-arm64
          path: native/artifacts/osx-arm64
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

  managed-conformance:
    name: Tests (macOS, ${{ matrix.section }})
    needs: terminal-native-assets
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        section: [core, agent, app, services, data-browser, terminal-host]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Expose the SDK at the repository-local path
        run: |
          mkdir -p .dotnet
          ln -s "$(command -v dotnet)" .dotnet/dotnet
      - name: Download terminal font assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terminal-font-test-assets
          path: native/artifacts/common
      - name: Download macOS terminal runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terminal-native-osx-arm64
          path: native/artifacts/osx-arm64
      - name: Restore the locked dependency graph
        shell: bash
        run: dotnet restore Asura.slnx --locked-mode
      - name: Run test section
        shell: bash
        run: ./scripts/test-section.sh "${{ matrix.section }}" --no-restore
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ runner.os }}-${{ matrix.section }}
          path: ".test-results/**/*.trx"
          if-no-files-found: error
          include-hidden-files: true

  macos-release-build:
    name: Release build (macOS)
    needs: terminal-native-assets
    timeout-minutes: 45
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Expose the SDK at the repository-local path
        run: |
          mkdir -p .dotnet
          ln -s "$(command -v dotnet)" .dotnet/dotnet
      - name: Download terminal font assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terminal-font-test-assets
          path: native/artifacts/common
      - name: Download macOS terminal runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terminal-native-osx-arm64
          path: native/artifacts/osx-arm64
      - name: Restore the locked dependency graph
        shell: bash
        run: dotnet restore Asura.slnx --locked-mode
      - name: Build the complete solution
        shell: bash
        run: dotnet build Asura.slnx --configuration Release --no-restore --nologo

  format-and-boundaries:
    name: Format and architecture boundaries
    needs: terminal-native-assets
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Set up the pinned networking Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.3'
          cache: false
      - name: Expose the SDK at the repository-local path
        run: |
          mkdir -p .dotnet
          ln -s "$(command -v dotnet)" .dotnet/dotnet
      - name: Download terminal font assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terminal-font-test-assets
          path: native/artifacts/common
      - name: Download macOS terminal runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: terminal-native-osx-arm64
          path: native/artifacts/osx-arm64
      - name: Run the fast repository gate
        run: ./scripts/check.sh --quick

  dependency-security-evidence:
    name: Exact dependency security evidence
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Expose the SDK at the repository-local path
        run: |
          mkdir -p .dotnet
          ln -s "$(command -v dotnet)" .dotnet/dotnet
      - name: Restore the locked dependency graph
        run: dotnet restore Asura.slnx --locked-mode
      - name: Scan NuGet dependency graph
        run: |
          mkdir -p artifacts/dependency-scan
          dotnet package list \
            --project Asura.slnx \
            --vulnerable \
            --include-transitive \
            --format json \
            --output-version 1 \
            --no-restore > artifacts/dependency-scan/nuget-audit.json
      - name: Scan Maven dependency graph
        run: |
          scanner_directory="${RUNNER_TEMP}/asura-grype"
          scanner_archive="${scanner_directory}/grype_0.117.0_darwin_arm64.tar.gz"
          locked_maven_repository="${RUNNER_TEMP}/asura-locked-maven"
          mkdir -p "${scanner_directory}" artifacts/dependency-scan/grype-cache
          ./scripts/prepare-locked-maven-repository.py \
            native/sql-language-worker/maven-content-lock.json \
            "${locked_maven_repository}"
          (
            cd native/sql-language-worker
            mvn -B --offline \
              "-Dmaven.repo.local=${locked_maven_repository}" \
              clean \
              org.apache.maven.plugins:maven-dependency-plugin:3.8.1:list \
              -DincludeScope=runtime \
              -DoutputFile=target/runtime-dependencies.raw.txt \
              -DappendOutput=false \
              org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies \
              -DincludeScope=runtime \
              -DoutputDirectory=target/runtime-jars \
              -DoverWriteReleases=true \
              -DoverWriteSnapshots=true \
              -DoverWriteIfNewer=true
            ./generate-third-party-notices.sh \
              --dependency-list target/runtime-dependencies.raw.txt \
              --jar-directory target/runtime-jars \
              --manifest target/runtime-dependencies.txt \
              --output target/THIRD-PARTY-NOTICES.md \
              --metadata target/legal-closure.properties
          )
          curl --fail --location --silent --show-error \
            https://github.com/anchore/grype/releases/download/v0.117.0/grype_0.117.0_darwin_arm64.tar.gz \
            --output "${scanner_archive}"
          echo "bfcefa3f3b1690d9c77d847841b32ebd6106ab0e0e32f810924707e704d53584  ${scanner_archive}" \
            | shasum -a 256 -c -
          tar -xzf "${scanner_archive}" -C "${scanner_directory}" grype
          GRYPE_DB_CACHE_DIR="$PWD/artifacts/dependency-scan/grype-cache" \
            "${scanner_directory}/grype" dir:native/sql-language-worker/target/runtime-jars \
            --output json \
            --file artifacts/dependency-scan/maven-audit.json \
            --fail-on low
      - name: Assemble closed dependency evidence
        run: >-
          ./.dotnet/dotnet run
          --project tools/Asura.SecurityCampaign/Asura.SecurityCampaign.csproj
          --configuration Release
          --
          assemble-dependency-evidence
          --source-commit "${GITHUB_SHA}"
          --nuget artifacts/dependency-scan/nuget-audit.json
          --maven artifacts/dependency-scan/maven-audit.json
          --output artifacts/dependency-security-evidence
      - name: Upload dependency evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-security-evidence
          path: artifacts/dependency-security-evidence
          if-no-files-found: error
          retention-days: 30

  macos-early-release:
    name: macOS arm64 early release
    needs: [managed-conformance, macos-release-build, format-and-boundaries, dependency-security-evidence]
    runs-on: macos-26
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Set up the pinned networking Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.3'
          cache: false
      - name: Seal exact tagged source before any release build
        shell: bash
        run: |
          sealed_source="${RUNNER_TEMP}/asura-sealed-source"
          campaign_tool="${RUNNER_TEMP}/asura-security-campaign-tool"
          campaign_build="${RUNNER_TEMP}/asura-security-campaign-build"
          source_seal="${RUNNER_TEMP}/asura-source-seal"
          release_artifacts="${RUNNER_TEMP}/asura-release-artifacts"
          build_artifacts="${RUNNER_TEMP}/asura-release-build"
          nuget_packages="${RUNNER_TEMP}/asura-release-nuget"
          source_tree="$(git rev-parse "${GITHUB_SHA}^{tree}")"
          test ! -e "${sealed_source}"
          mkdir -p "${sealed_source}" "${campaign_tool}" "${release_artifacts}" \
            "${build_artifacts}" "${nuget_packages}"
          git archive --format=tar "${GITHUB_SHA}" | tar -xf - -C "${sealed_source}"
          NUGET_PACKAGES="${nuget_packages}" dotnet publish \
            "${sealed_source}/tools/Asura.SecurityCampaign/Asura.SecurityCampaign.csproj" \
            --configuration Release \
            --artifacts-path "${campaign_build}" \
            --output "${campaign_tool}"
          dotnet "${campaign_tool}/Asura.SecurityCampaign.dll" \
            seal-release-source \
            --repository "${GITHUB_WORKSPACE}" \
            --source-root "${sealed_source}" \
            --source-commit "${GITHUB_SHA}" \
            --source-tree "${source_tree}" \
            --tag "${GITHUB_REF_NAME}" \
            --output "${source_seal}"
          mkdir -p \
            "${sealed_source}/.deps" \
            "${sealed_source}/native/artifacts"
          chmod -R a-w "${sealed_source}"
          chmod -R u+rwX \
            "${sealed_source}/.deps" \
            "${sealed_source}/native/artifacts"
          {
            echo "ASURA_RELEASE_SOURCE_ROOT=${sealed_source}"
            echo "ASURA_RELEASE_SOURCE_SEAL=${source_seal}"
            echo "ASURA_SECURITY_CAMPAIGN_TOOL=${campaign_tool}/Asura.SecurityCampaign.dll"
            echo "ASURA_RELEASE_ARTIFACTS=${release_artifacts}"
            echo "ASURA_BUILD_ARTIFACTS_ROOT=${build_artifacts}"
            echo "ASURA_DOTNET=$(command -v dotnet)"
            echo "ASURA_RELEASE_SOURCE_COMMIT=${GITHUB_SHA}"
            echo "ASURA_RELEASE_SOURCE_TREE=${source_tree}"
            echo "ASURA_RELEASE_SOURCE_TAG=${GITHUB_REF_NAME}"
            echo "NUGET_PACKAGES=${nuget_packages}"
          } >> "${GITHUB_ENV}"
      - name: Set up the pinned Native Image toolchain
        uses: graalvm/setup-graalvm@5298d94fb55a4f185c602eeac5de1b553882abe2 # v1.6.4
        with:
          java-version: 25.0.4
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: true
      - name: Set up the Native AOT linker
        run: |
          brew install lld@22
          echo "ASURA_NATIVE_AOT_LINKER=$(brew --prefix lld@22)/bin/ld64.lld" >> "${GITHUB_ENV}"
      - name: Resolve release version
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "${version}" =~ ^[0-9]{1,9}\.[0-9]{1,9}\.[0-9]{1,9}$ ]]; then
            echo "Release version must contain exactly three unsigned integer parts." >&2
            exit 64
          fi
          if [[ "$(uname -m)" != "arm64" ]]; then
            echo "The macOS release job requires an Apple Silicon runner." >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Verify macOS legal publication clearance
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd "${ASURA_RELEASE_SOURCE_ROOT}"
          python3 ./scripts/package-workspace-backend.py verify-release-clearance .
          ASURA_BACKEND_ARCH=x64 python3 ./scripts/package-workspace-backend.py verify-release-clearance .
          dotnet run \
            --project tools/Asura.Packaging/Asura.Packaging.csproj \
            --configuration Release \
            --artifacts-path "${ASURA_BUILD_ARTIFACTS_ROOT}/legal" \
            -- \
            macos-release-legal \
            --record licenses/macos-release-legal.json \
            --source-root . \
            --require-clearance
      - name: Select full Xcode 26 for adaptive icon compilation
        shell: bash
        run: |
          xcode_application="/Applications/Xcode.app"
          if [[ ! -d "${xcode_application}/Contents/Developer" ]] \
              || ! DEVELOPER_DIR="${xcode_application}/Contents/Developer" \
                  xcrun actool --version --output-format=human-readable-text \
                  | grep -Eq 'short-bundle-version: (2[6-9]|[3-9][0-9]|[1-9][0-9]{2,})(\.|$)'; then
            xcode_application="$(find /Applications -maxdepth 1 -type d \
              -name 'Xcode_26*.app' -print | sort | tail -n 1)"
          fi
          if [[ -z "${xcode_application}" \
              || ! -d "${xcode_application}/Contents/Developer" ]]; then
            echo "The release runner does not provide full Xcode 26." >&2
            exit 1
          fi
          developer_directory="${xcode_application}/Contents/Developer"
          actool_version="$(DEVELOPER_DIR="${developer_directory}" \
            xcrun actool --version --output-format=human-readable-text)"
          if ! grep -Eq 'short-bundle-version: (2[6-9]|[3-9][0-9]|[1-9][0-9]{2,})(\.|$)' \
              <<< "${actool_version}"; then
            echo "The selected Xcode does not provide actool 26 or newer." >&2
            exit 1
          fi
          echo "DEVELOPER_DIR=${developer_directory}" >> "${GITHUB_ENV}"
      - name: Build verified native payloads
        run: |
          cd "${ASURA_RELEASE_SOURCE_ROOT}"
          ./scripts/build-libghostty-vt.sh --rid osx-arm64
          ./scripts/build-workspace-network-gateway.sh --rid osx-arm64
          ./scripts/build-workspace-runtime.sh
          ./scripts/build-workspace-backend.sh
          ASURA_BACKEND_ARCH=x64 ./scripts/build-workspace-backend.sh
          ./scripts/build-openvpn-engine.sh
          ./scripts/build-macos-connection-engines.sh
          ./scripts/build-sql-language-worker.sh --local --rid osx-arm64
          # The browser probes exercise real first-use Keychain encryption.
          # Give this disposable CI runner an empty, unlocked test keychain.
          test_keychain="${RUNNER_TEMP}/asura-browser-tests.keychain-db"
          test_keychain_password="$(uuidgen)"
          security create-keychain -p "${test_keychain_password}" "${test_keychain}"
          security set-keychain-settings -lut 21600 "${test_keychain}"
          security unlock-keychain -p "${test_keychain_password}" "${test_keychain}"
          security list-keychains -d user -s "${test_keychain}"
          security default-keychain -d user -s "${test_keychain}"
          ./scripts/build-cef-runtime.sh --rid osx-arm64 --dotnet "${ASURA_DOTNET}"
      - name: Download campaign test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test-results-*
          path: ${{ runner.temp }}/asura-release-artifacts/campaign-test-results
          merge-multiple: true
      - name: Download dependency security evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-security-evidence
          path: ${{ runner.temp }}/asura-release-artifacts/dependency-security-evidence
      - name: Configure Developer ID signing and notarization
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_ID_APPLICATION: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY_BASE64 }}
        run: |
          for required in \
            APPLE_CERTIFICATE_P12_BASE64 \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_DEVELOPER_ID_APPLICATION \
            APPLE_NOTARY_ISSUER_ID \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_PRIVATE_KEY_BASE64; do
            if [[ -z "${!required}" ]]; then
              echo "Required release secret ${required} is not configured." >&2
              exit 1
            fi
          done

          signing_directory="${RUNNER_TEMP}/asura-signing"
          signing_keychain="${signing_directory}/release.keychain-db"
          signing_password="$(uuidgen)"
          mkdir -p "${signing_directory}"
          echo "ASURA_SIGNING_DIRECTORY=${signing_directory}" >> "${GITHUB_ENV}"
          echo "ASURA_SIGNING_KEYCHAIN=${signing_keychain}" >> "${GITHUB_ENV}"
          printf '%s' "${APPLE_CERTIFICATE_P12_BASE64}" \
            | /usr/bin/base64 -D > "${signing_directory}/certificate.p12"
          printf '%s' "${APPLE_NOTARY_PRIVATE_KEY_BASE64}" \
            | /usr/bin/base64 -D > "${signing_directory}/AuthKey.p8"

          security create-keychain -p "${signing_password}" "${signing_keychain}"
          security set-keychain-settings -lut 21600 "${signing_keychain}"
          security unlock-keychain -p "${signing_password}" "${signing_keychain}"
          security import "${signing_directory}/certificate.p12" \
            -k "${signing_keychain}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "${signing_password}" \
            "${signing_keychain}"
          security list-keychains -d user -s "${signing_keychain}"
          security default-keychain -d user -s "${signing_keychain}"
          security find-identity -v -p codesigning "${signing_keychain}" \
            | grep -Fq "${APPLE_DEVELOPER_ID_APPLICATION}"

          xcrun notarytool store-credentials asura-ci \
            --keychain "${signing_keychain}" \
            --key "${signing_directory}/AuthKey.p8" \
            --key-id "${APPLE_NOTARY_KEY_ID}" \
            --issuer "${APPLE_NOTARY_ISSUER_ID}"
          echo "ASURA_SIGNING_IDENTITY=${APPLE_DEVELOPER_ID_APPLICATION}" >> "${GITHUB_ENV}"
      - name: Assemble update-aware macOS release
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          cd "${ASURA_RELEASE_SOURCE_ROOT}"
          ./scripts/package-macos-github-release.sh \
            --version "${RELEASE_VERSION}" \
            --build-version "${GITHUB_RUN_NUMBER}" \
            --sign-identity "${ASURA_SIGNING_IDENTITY}" \
            --notary-profile asura-ci \
            --keychain "${ASURA_SIGNING_KEYCHAIN}" \
            --release-evidence-dir "${ASURA_RELEASE_ARTIFACTS}/release-evidence" \
            --source-seal "${ASURA_RELEASE_SOURCE_SEAL}" \
            --security-campaign-tool "${ASURA_SECURITY_CAMPAIGN_TOOL}" \
            --build-artifacts-root "${ASURA_BUILD_ARTIFACTS_ROOT}/package" \
            --output-dir "${ASURA_RELEASE_ARTIFACTS}/distribution"
      - name: Verify update-aware release candidate
        run: |
          archive="Asura-macOS-arm64.zip"
          distribution="${ASURA_RELEASE_ARTIFACTS}/distribution"
          verification_directory="${RUNNER_TEMP}/asura-archive"
          test ! -e "${verification_directory}"
          mkdir -p "${verification_directory}"
          ditto -x -k "${distribution}/${archive}" "${verification_directory}"
          codesign --verify --deep --strict --verbose=2 \
            "${verification_directory}/Asura.app"
          xcrun stapler validate "${verification_directory}/Asura.app"
          spctl --assess --type execute --verbose=2 \
            "${verification_directory}/Asura.app"
          test "$(plutil -extract CFBundleShortVersionString raw \
            "${verification_directory}/Asura.app/Contents/Info.plist")" \
            = "${{ steps.release.outputs.version }}"
          info_plist="${verification_directory}/Asura.app/Contents/Info.plist"
          test "$(plutil -extract CFBundleDisplayName raw "${info_plist}")" = "Asura"
          test "$(plutil -extract CFBundleExecutable raw "${info_plist}")" = "Asura"
          test "$(plutil -extract CFBundleIdentifier raw "${info_plist}")" = "sh.asura"
          test "$(plutil -extract CFBundleIconName raw "${info_plist}")" = "Asura"
          assets_car="${verification_directory}/Asura.app/Contents/Resources/Assets.car"
          test -f "${assets_car}"
          assetutil --info "${assets_car}" > "${verification_directory}/Assets.info.json"
          grep -Fq '"AssetType" : "Icon Image"' "${verification_directory}/Assets.info.json"
          grep -Fq '"Name" : "Asura"' "${verification_directory}/Assets.info.json"
          test -x "${verification_directory}/Asura.app/Contents/MacOS/UpdateMac"
          test "$(readlink "${verification_directory}/Asura.app/Contents/MacOS/sq.version")" \
            = "../Resources/sq.version"
          echo "ASURA_EXTRACTED_APP=${verification_directory}/Asura.app" >> "${GITHUB_ENV}"
      - name: Assemble exact release-candidate evidence
        run: |
          dotnet "${ASURA_SECURITY_CAMPAIGN_TOOL}" \
            assemble-release-evidence \
            --repository "${ASURA_RELEASE_SOURCE_ROOT}" \
            --source-commit "${GITHUB_SHA}" \
            --source-tree "${ASURA_RELEASE_SOURCE_TREE}" \
            --tag "${GITHUB_REF_NAME}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --source-seal "${ASURA_RELEASE_SOURCE_SEAL}" \
            --build-identity "${ASURA_RELEASE_ARTIFACTS}/release-evidence/release-build-identity.json" \
            --archive "${ASURA_RELEASE_ARTIFACTS}/distribution/Asura-macOS-arm64.zip" \
            --package "${ASURA_EXTRACTED_APP}" \
            --test-results "${ASURA_RELEASE_ARTIFACTS}/campaign-test-results" \
            --dependency-evidence "${ASURA_RELEASE_ARTIFACTS}/dependency-security-evidence/evidence.json" \
            --notarization-evidence "${ASURA_RELEASE_ARTIFACTS}/release-evidence/notarization.json" \
            --output "${ASURA_RELEASE_ARTIFACTS}/security-campaign"
      - name: Revalidate exact release-candidate evidence
        run: |
          dotnet "${ASURA_SECURITY_CAMPAIGN_TOOL}" \
            validate-release-evidence \
            --repository "${ASURA_RELEASE_SOURCE_ROOT}" \
            --source-commit "${GITHUB_SHA}" \
            --source-tree "${ASURA_RELEASE_SOURCE_TREE}" \
            --tag "${GITHUB_REF_NAME}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --source-seal "${ASURA_RELEASE_SOURCE_SEAL}" \
            --build-identity "${ASURA_RELEASE_ARTIFACTS}/release-evidence/release-build-identity.json" \
            --archive "${ASURA_RELEASE_ARTIFACTS}/distribution/Asura-macOS-arm64.zip" \
            --package "${ASURA_EXTRACTED_APP}" \
            --test-results "${ASURA_RELEASE_ARTIFACTS}/campaign-test-results" \
            --dependency-evidence "${ASURA_RELEASE_ARTIFACTS}/dependency-security-evidence/evidence.json" \
            --notarization-evidence "${ASURA_RELEASE_ARTIFACTS}/release-evidence/notarization.json" \
            --evidence "${ASURA_RELEASE_ARTIFACTS}/security-campaign"
      - name: Upload macOS release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asura-macos-arm64
          path: |
            ${{ runner.temp }}/asura-release-artifacts/distribution/*
            ${{ runner.temp }}/asura-release-artifacts/security-campaign/receipt.json
            ${{ runner.temp }}/asura-release-artifacts/security-campaign/receipt.json.sha256
            ${{ runner.temp }}/asura-release-artifacts/security-campaign/receipt.md
            ${{ runner.temp }}/asura-release-artifacts/dependency-security-evidence/evidence.json
            ${{ runner.temp }}/asura-release-artifacts/release-evidence/release-build-identity.json
            ${{ runner.temp }}/asura-source-seal/source-seal.json
            ${{ runner.temp }}/asura-source-seal/source-seal.json.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "${ASURA_RELEASE_ARTIFACTS}/distribution/Asura-workspace-boot-arm64.zip" \
            "${ASURA_RELEASE_ARTIFACTS}/distribution/Asura-workspace-boot-arm64.zip.sha256" \
            "${ASURA_RELEASE_ARTIFACTS}/distribution/Asura-workspace-backend-arm64.tar.gz" \
            "${ASURA_RELEASE_ARTIFACTS}/distribution/Asura-workspace-backend-arm64.tar.gz.sha256" \
            "${ASURA_RELEASE_ARTIFACTS}/distribution/Asura-workspace-backend-x64.tar.gz" \
            "${ASURA_RELEASE_ARTIFACTS}/distribution/Asura-workspace-backend-x64.tar.gz.sha256" \
            "${ASURA_RELEASE_ARTIFACTS}/distribution/Asura-networking-sources.zip" \
            "${ASURA_RELEASE_ARTIFACTS}/distribution/Asura-networking-sources.zip.sha256" \
            "${ASURA_RELEASE_ARTIFACTS}/distribution/Asura-macOS-arm64.zip" \
            "${ASURA_RELEASE_ARTIFACTS}/distribution/Asura-macOS-arm64.zip.sha256" \
            "${ASURA_RELEASE_ARTIFACTS}/distribution/sh.asura-${RELEASE_VERSION}-osx-arm64-stable-full.nupkg" \
            "${ASURA_RELEASE_ARTIFACTS}/distribution/sh.asura-${RELEASE_VERSION}-osx-arm64-stable-full.nupkg.sha256" \
            "${ASURA_RELEASE_ARTIFACTS}/distribution/releases.osx-arm64-stable.json" \
            "${ASURA_RELEASE_ARTIFACTS}/distribution/releases.osx-arm64-stable.json.sha256" \
            "${ASURA_RELEASE_ARTIFACTS}/security-campaign/receipt.json" \
            "${ASURA_RELEASE_ARTIFACTS}/security-campaign/receipt.json.sha256" \
            "${ASURA_RELEASE_ARTIFACTS}/security-campaign/receipt.md" \
            "${ASURA_RELEASE_ARTIFACTS}/dependency-security-evidence/evidence.json" \
            "${ASURA_RELEASE_ARTIFACTS}/release-evidence/release-build-identity.json" \
            "${ASURA_RELEASE_SOURCE_SEAL}/source-seal.json" \
            "${ASURA_RELEASE_SOURCE_SEAL}/source-seal.json.sha256" \
            --fail-on-no-commits \
            --generate-notes \
            --latest \
            --notes "Developer ID signed and notarized Apple Silicon build. The portable archive and Velopack full package/feed contain the same verified app, including the signed updater metadata required for user-initiated in-app updates." \
            --title "Asura ${RELEASE_VERSION} early macOS release" \
            --verify-tag
      - name: Remove temporary signing credentials
        if: always()
        run: |
          if [[ -f "${RUNNER_TEMP}/asura-browser-tests.keychain-db" ]]; then
            security delete-keychain "${RUNNER_TEMP}/asura-browser-tests.keychain-db"
          fi
          if [[ -n "${ASURA_SIGNING_KEYCHAIN:-}" && -f "${ASURA_SIGNING_KEYCHAIN}" ]]; then
            security delete-keychain "${ASURA_SIGNING_KEYCHAIN}"
          fi
          if [[ -n "${ASURA_SIGNING_DIRECTORY:-}" && -d "${ASURA_SIGNING_DIRECTORY}" ]]; then
            rm -rf -- "${ASURA_SIGNING_DIRECTORY}"
          fi
